name: Profile editor history
on:
  pull_request:
    paths:
      - 'scripts/profile-history.mjs'
      - 'docs/history-profiling.md'
      - 'package.json'
      - '.github/workflows/profile-history.yml'
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Measure history scenarios
        run: npm run profile:history | tee history-profile.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slide-fable-history-profile
          path: history-profile.json
          if-no-files-found: warn
