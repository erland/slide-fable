name: Verify Slide Fable candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r requirements-dev.txt -r requirements-dev002.txt
      - run: npm ci
      - name: Fast source checks before browser setup
        run: |
          npm run lint
          node --check tests/export-data-parity-browser.mjs
          node --check tests/export-geometry-parity-browser.mjs
          node --check tests/text-export-parity-browser.mjs
          node --experimental-strip-types --test tests/*.test.mjs
          npm run build
      - name: Install Chromium or use runner Chrome
        timeout-minutes: 5
        run: |
          if timeout --kill-after=15s 180s npx playwright install chromium; then
            echo "Using Playwright Chromium"
          else
            chrome_path="$(command -v google-chrome || command -v chromium || true)"
            if [ -z "$chrome_path" ]; then
              echo "Chromium download failed and no runner browser is available"
              exit 1
            fi
            echo "CHROMIUM_EXECUTABLE=$chrome_path" >> "$GITHUB_ENV"
            "$chrome_path" --version
          fi
      - name: Install PDF rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Verify candidate and capture visual evidence
        run: python scripts/verify_release_candidate.py
        env:
          EDITOR_OUTPUT: ${{ runner.temp }}/slide-fable-editor-evidence
          PWA_OUTPUT: ${{ runner.temp }}/slide-fable-pwa-evidence
          RELEASE_EVIDENCE_OUTPUT: ${{ runner.temp }}/slide-fable-release-evidence.json
      - name: Archive editor screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slide-fable-visual-evidence
          path: |
            ${{ runner.temp }}/slide-fable-editor-evidence/
            ${{ runner.temp }}/slide-fable-pwa-evidence/
            ${{ runner.temp }}/slide-fable-release-evidence.json
          if-no-files-found: warn
          retention-days: 14
