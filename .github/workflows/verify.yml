name: Verify Slide Fable candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r requirements-dev.txt -r requirements-dev002.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/verify_release_candidate.py
