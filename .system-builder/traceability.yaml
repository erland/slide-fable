  source_text: '- **PPD-F-202:** `masters[].layouts[]` definierar namngivna layouter
    (titel, innehåll, två kolumner, bild + text, tom) och deras platshållare. En platshållare
    har `id`, `role`, `geometry`, `styleRef`, valfri `required` och eventuell `defaultContent`.'
  status: not_verified
  coverage: governing_reference
  implementation_assessment: docs/release-review.md
- id: PPD-F-203
  source: reference/presentationsformat_forslag_v0_3.md
