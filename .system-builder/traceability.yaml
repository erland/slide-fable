  coverage: governing_reference
  implementation_assessment: docs/release-review.md
- id: PPD-F-204
  source: reference/presentationsformat_forslag_v0_3.md
  line: 586
  source_text: '- **PPD-F-204:** `layoutId` och `masterId` måste referera till existerande
    och kompatibla objekt. Ingen tyst ombindning av roller som `title`, `body`, `image`,
    `footer`.'
